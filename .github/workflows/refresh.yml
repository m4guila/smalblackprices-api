name: Atualizar produtos

on:
  schedule:
    - cron: "17 10 * * *"   # 07:17 em Brasília. O GitHub atrasa até ~1h; fora da hora cheia atrasa menos
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Atualizar produtos
        run: |
          curl -sS --fail-with-body -X POST https://smalblackprices-api.onrender.com/api/refresh \
            -H "x-refresh-key: ${{ secrets.REFRESH_KEY }}" \
            --max-time 300
