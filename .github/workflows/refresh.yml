name: Atualizar produtos

on:
  # Disparado pelo cron-job.org às 07:17 (Brasília); o agendamento do GitHub atrasava ou pulava.
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Atualizar produtos
        run: |
          curl -sS --fail-with-body -X POST https://smalblackprices-api.onrender.com/api/refresh \
            -H "x-refresh-key: ${{ secrets.REFRESH_KEY }}" \
            --max-time 300
